name: Sphere extension release

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing vX.Y.Z tag to publish (normally use a tag push)
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: sphere-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      REVIEW_SERVICE_ORIGIN: ${{ vars.REVIEW_SERVICE_ORIGIN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - name: Resolve and validate authoritative release tag
        env:
          REQUESTED_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          release_tag="$REQUESTED_TAG"
          [[ "$release_tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          git show-ref --verify --quiet "refs/tags/$release_tag"
          tag_commit="$(git rev-list -n 1 "refs/tags/$release_tag")"
          head_commit="$(git rev-parse HEAD)"
          [[ "$tag_commit" == "$head_commit" ]]
          if [[ "$EVENT_NAME" == "push" ]]; then
            [[ "$head_commit" == "$EVENT_COMMIT" ]]
          fi
          release_version="${release_tag#v}"
          package_version="$(python3 -c 'import json; print(json.load(open("extension/package.json"))["version"])')"
          [[ "$release_version" == "$package_version" ]]
          echo "RELEASE_TAG=$release_tag" >> "$GITHUB_ENV"
          echo "RELEASE_VERSION=$release_version" >> "$GITHUB_ENV"
          echo "BUILD_COMMIT=$head_commit" >> "$GITHUB_ENV"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: extension/package-lock.json

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pinned build and test dependencies
        run: python3 -m pip install -e '.[dev]'
        working-directory: server

      - name: Install root build dependencies
        run: |
          python3 -m pip install -r scripts/requirements-build.txt
          python3 -m pip install PyYAML

      - name: Install extension dependencies
        run: npm ci
        working-directory: extension

      - name: Verify source, extension, server, and package gates
        run: |
          npm test
          npm run typecheck
          npm run build
        working-directory: extension

      - name: Run server tests
        run: python3 -m pytest -q
        working-directory: server

      - name: Run deployment, store, and public-site tests
        run: python3 -m unittest tests/test_deployment_package.py tests/test_store_package.py tests/test_public_release_site.py tests/test_release_artifacts.py tests/test_store_readiness.py

      # The PEM exists only for this step. Keeping key creation, build, and
      # cleanup in one step makes the EXIT trap cover every use of the secret.
      - name: Build production extension with ephemeral key
        env:
          EXTENSION_PRIVATE_KEY_PEM: ${{ secrets.EXTENSION_PRIVATE_KEY_PEM }}
          REVIEW_SERVICE_ORIGIN: ${{ vars.REVIEW_SERVICE_ORIGIN }}
        run: |
          set -euo pipefail
          umask 077
          key_file="$(mktemp "$RUNNER_TEMP/sphere-extension-key.XXXXXX.pem")"
          cleanup() { rm -f -- "$key_file"; }
          trap cleanup EXIT HUP INT TERM
          printf '%s' "$EXTENSION_PRIVATE_KEY_PEM" > "$key_file"
          chmod 600 "$key_file"
          test "$(stat -c '%a' "$key_file")" = 600
          rm -rf extension/dist
          PRIVATE_KEY_PATH="$key_file" \
            REVIEW_SERVICE_ORIGIN="$REVIEW_SERVICE_ORIGIN" \
            OPTIONAL_FRAME_PATTERNS="$(awk 'NF && $1 !~ /^#/ { printf "%s%s", separator, $0; separator="," }' deploy/config/pilot-optional-frame-patterns.txt)" \
            BUILD_COMMIT="$BUILD_COMMIT" \
            deploy/scripts/build-pilot-extension.sh
          test -f extension/dist/manifest.json
          test -f extension/dist/icons/icon16.png

      - name: Package pilot and Web Store artifacts in isolated runner storage
        run: |
          set -euo pipefail
          release_version="$RELEASE_VERSION"
          delivery="$RUNNER_TEMP/sphere-pilot-delivery"
          artifacts="$RUNNER_TEMP/sphere-release-assets"
          mkdir -p "$artifacts"
          python3 deploy/scripts/release_artifacts.py \
            --root "$GITHUB_WORKSPACE" \
            --dist "$GITHUB_WORKSPACE/extension/dist" \
            --delivery "$delivery" \
            --version "$release_version"
          python3 deploy/scripts/store_package.py \
            --dist "$GITHUB_WORKSPACE/extension/dist" \
            --output "$artifacts/sphere-web-store-v${release_version}.zip" \
            --version "$release_version" \
            --repository "radicalmove/radcra" \
            --build-commit "$BUILD_COMMIT"
          test -f "$artifacts/sphere-web-store-v${release_version}.report.json"
          cp "$delivery/moodle-review-extension-v${release_version}-chrome-edge.zip" "$artifacts/"
          cp "$delivery/moodle-review-extension-chrome-edge.zip" "$artifacts/"
          cp "$GITHUB_WORKSPACE/store-assets/sphere-promo-440x280.png" "$artifacts/"
          cp "$GITHUB_WORKSPACE/store-assets/sphere-screenshot-1280x800.png" "$artifacts/"
          for archive in "$artifacts"/*.zip; do
            printf '%s  %s\n' "$(sha256sum "$archive" | awk '{print $1}')" "$(basename "$archive")" > "$archive.sha256"
          done
          # Publish one checksum file covering every uploaded ZIP.
          (cd "$artifacts" && sha256sum *.zip > SHA256SUMS)
          cat > "$artifacts/RELEASE_NOTES.md" <<EOF
          # Sphere ${release_version}

          **THIS EXTENSION IS FOR BETA TESTING.**

          - Web Store upload: [sphere-web-store-v${release_version}.zip](https://github.com/radicalmove/radcra/releases/download/${RELEASE_TAG}/sphere-web-store-v${release_version}.zip)
          - Web Store package report: [sphere-web-store-v${release_version}.report.json](https://github.com/radicalmove/radcra/releases/download/${RELEASE_TAG}/sphere-web-store-v${release_version}.report.json)
          - Private pilot (Chrome/Edge Load unpacked): [moodle-review-extension-v${release_version}-chrome-edge.zip](https://github.com/radicalmove/radcra/releases/download/${RELEASE_TAG}/moodle-review-extension-v${release_version}-chrome-edge.zip)
          - Read [releasing.md](https://github.com/radicalmove/radcra/blob/main/docs/releasing.md) for installation and update guidance.

          Web Store installations update through Chrome. Unpacked pilot installations require replacing the folder and pressing Reload.
          EOF
          echo "RELEASE_ASSETS=$artifacts" >> "$GITHUB_ENV"

      - name: Generate release metadata evidence
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path

          version = os.environ["RELEASE_VERSION"]
          tag = os.environ["RELEASE_TAG"]
          document = {
              "schema_version": 1,
              "version": version,
              "release_url": f"https://github.com/radicalmove/radcra/releases/tag/{tag}",
              "download_url": "https://radicalmove.github.io/sphere/",
              "published_at": datetime.now(timezone.utc).replace(microsecond=0).isoformat().replace("+00:00", "Z"),
          }
          metadata = Path(os.environ["RELEASE_ASSETS"]) / "latest.json"
          metadata.write_text(json.dumps(document, indent=2) + "\n", encoding="utf-8")
          json.loads(metadata.read_text(encoding="utf-8"))
          PY

      - name: Verify exact Web Store submission evidence
        run: |
          set -euo pipefail
          release_version="$RELEASE_VERSION"
          artifacts="$RELEASE_ASSETS"
          python3 deploy/scripts/store_readiness.py --mode submission --root "$GITHUB_WORKSPACE" --package-report "$artifacts/sphere-web-store-v${release_version}.report.json" --checksum "$artifacts/sphere-web-store-v${release_version}.zip.sha256" --screenshot "$GITHUB_WORKSPACE/store-assets/sphere-screenshot-1280x800.png"

      - name: Publish GitHub release assets and notes
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          body_path: ${{ env.RELEASE_ASSETS }}/RELEASE_NOTES.md
          files: |
            ${{ env.RELEASE_ASSETS }}/*.zip
            ${{ env.RELEASE_ASSETS }}/*.sha256
            ${{ env.RELEASE_ASSETS }}/*.json
            ${{ env.RELEASE_ASSETS }}/*.png
            ${{ env.RELEASE_ASSETS }}/SHA256SUMS
