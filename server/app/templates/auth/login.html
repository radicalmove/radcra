<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Sign in</title><link rel="stylesheet" href="/static/app.css"></head>
<body><main class="auth-card"><p class="eyebrow">Sphere{% if next == "/admin" %} · Administration{% endif %}</p><h1>{% if next == "/admin" %}Admin sign-in{% else %}Sign in{% endif %}</h1><form method="post" action="/login"><input type="hidden" name="csrf_token" value="{{ csrf_token }}">{% if next %}<input type="hidden" name="next" value="{{ next }}">{% endif %}<label>Email<input type="email" name="email" autocomplete="username" required></label><label>Password<input type="password" name="password" autocomplete="current-password" required></label><button>Sign in</button></form>{% if next != "/admin" %}<p>Need an account? <a href="/register">Request access</a></p>{% endif %}</main></body></html>
