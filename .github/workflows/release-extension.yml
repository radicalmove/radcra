name: RADCRA extension release
on:
  push:
    tags: ['v*.*.*']
permissions:
  contents: write
  pages: write
  id-token: write
jobs:
  release:
    runs-on: ubuntu-latest
    env:
      REVIEW_SERVICE_ORIGIN: ${{ vars.REVIEW_SERVICE_ORIGIN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22, cache: npm, cache-dependency-path: extension/package-lock.json}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Install build and test dependencies
        run: |
          python3 -m pip install -r scripts/requirements-build.txt PyYAML
          (cd server && python3 -m pip install -e '.[dev]')
          (cd extension && npm ci)
      - name: Write production key without logging it
        env:
          EXTENSION_PRIVATE_KEY_PEM: ${{ secrets.EXTENSION_PRIVATE_KEY_PEM }}
        run: |
          umask 077
          key_file="$RUNNER_TEMP/radcra-extension.pem"
          printf '%s' "$EXTENSION_PRIVATE_KEY_PEM" > "$key_file"
          chmod 600 "$key_file"
          echo "PRIVATE_KEY_PATH=$key_file" >> "$GITHUB_ENV"
          trap 'rm -f "$key_file"' EXIT
      - name: Verify source and build
        run: |
          (cd extension && npm test && npm run typecheck && npm run build)
          (cd server && python3 -m pytest -q)
          python3 -m unittest tests/test_deployment_package.py tests/test_store_package.py tests/test_public_release_site.py
      - name: Build release packages
        run: |
          RELEASE_VERSION=$(node -p "require('./extension/package.json').version")
          PRIVATE_KEY_PATH="$PRIVATE_KEY_PATH" REVIEW_SERVICE_ORIGIN="$REVIEW_SERVICE_ORIGIN" deploy/scripts/release-pilot-extension.sh
          echo "RELEASE_VERSION=$RELEASE_VERSION" >> "$GITHUB_ENV"
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          p = Path('site/latest.json')
          data = json.loads(p.read_text())
          data.update(version=os.environ['RELEASE_VERSION'], release_url=f"https://github.com/radicalmove/Beta-testing-app/releases/tag/{os.environ['GITHUB_REF_NAME']}")
          p.write_text(json.dumps(data, separators=(',', ':')) + '\n')
          PY
      - name: Publish GitHub release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: |
            ${{ github.workspace }}-pilot-builds/*.zip
            ${{ github.workspace }}-pilot-builds/*.sha256
      - name: Deploy authoritative Pages metadata
        uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: {path: site}
      - uses: actions/deploy-pages@v4
